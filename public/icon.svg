<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>

  <!-- Outer Shield Border -->
  <path d="M120 90 H392 V235 C392 345 256 415 256 415 C256 415 120 345 120 235 Z" 
        stroke="url(#shieldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bubbles Foam on Top of Car Roof -->
  <g>
    <circle cx="185" cy="145" r="22" fill="url(#bubbleGrad)" stroke="#e0f2fe" stroke-width="3"/>
    <circle cx="228" cy="125" r="28" fill="url(#bubbleGrad)" stroke="#e0f2fe" stroke-width="3.5"/>
    <circle cx="276" cy="120" r="30" fill="url(#bubbleGrad)" stroke="#e0f2fe" stroke-width="3.5"/>
    <circle cx="325" cy="140" r="24" fill="url(#bubbleGrad)" stroke="#e0f2fe" stroke-width="3"/>
    <circle cx="254" cy="90" r="12" fill="#f0f9ff"/>
    <circle cx="300" cy="98" r="10" fill="#f0f9ff"/>
    <circle cx="158" cy="165" r="14" fill="url(#bubbleGrad)" stroke="#e0f2fe" stroke-width="2"/>
    <circle cx="350" cy="160" r="15" fill="url(#bubbleGrad)" stroke="#e0f2fe" stroke-width="2"/>
  </g>

  <!-- Car Silhouette -->
  <path d="M125 245 L180 195 H325 L380 230 L395 258 H358 C358 240 330 240 330 258 H198 C198 240 170 240 170 258 H115 Z" 
        fill="url(#carGrad)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>

  <!-- Windows -->
  <path d="M188 202 H248 V232 H165 Z" fill="#0284c7" opacity="0.9"/>
  <path d="M260 202 H320 L350 232 H260 Z" fill="#0284c7" opacity="0.9"/>

  <!-- Wheel Arches -->
  <path d="M152 262 A 32 32 0 0 1 216 262" stroke="url(#shieldGrad)" stroke-width="8" fill="none"/>
  <path d="M312 262 A 32 32 0 0 1 376 262" stroke="url(#shieldGrad)" stroke-width="8" fill="none"/>

  <!-- Brand Typography: PUFF.id -->
  <text x="256" y="325" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="52" font-weight="900" fill="#ffffff" letter-spacing="1">
    PUFF<tspan fill="#38bdf8">.id</tspan>
  </text>

  <!-- Tagline: we come, we clean, you shine -->
  <text x="256" y="354" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="17" font-weight="600" fill="#e0f2fe" letter-spacing="0.5">
    we come, we clean, you shine
  </text>

  <!-- Lower Shield Accent Chevron -->
  <path d="M190 380 L256 410 L322 380" stroke="url(#shieldGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
